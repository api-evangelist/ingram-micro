openapi: 3.2.0
info:
  title: Ingram Micro Vendor Inventory API
  description: The Ingram Micro Vendor API provides REST API access for technology vendors to manage inventory, orders, and supply chain operations through Ingram Micro's distribution network.
  version: 1.0.0
  contact:
    name: Ingram Micro
    url: https://developer.ingrammicro.com/
servers:
- url: https://api.ingrammicro.com/vendors/v1
  description: Production
tags:
- name: Inventory
  description: Inventory management operations
paths:
  /inventory:
    get:
      operationId: getInventory
      summary: Get Inventory
      description: Retrieve inventory levels across Ingram Micro warehouses.
      tags:
      - Inventory
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryList'
components:
  schemas:
    InventoryItem:
      type: object
      properties:
        partNumber:
          type: string
        warehouse:
          type: string
        quantity:
          type: integer
        lastUpdated:
          type: string
          format: date-time
    InventoryList:
      type: object
      properties:
        inventory:
          type: array
          items:
            $ref: '#/components/schemas/InventoryItem'
